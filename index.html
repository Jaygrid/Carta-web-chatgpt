<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carta · Restaurante El Bizarro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#f4f4f4;margin:0;color:#222}
header{background:#111;color:#fff;padding:20px 15px 45px;text-align:center;position:relative}
header h1{margin:0;font-weight:600}
header .desc{font-size:.8em;color:#ccc;margin-top:10px;line-height:1.4}
.menu-toggle{position:absolute;left:15px;bottom:-18px;background:#e6e6e6;color:#111;
padding:10px 20px;border-radius:8px;font-size:1em;font-weight:600;cursor:pointer}
.container{display:flex}
.menu-side{width:100px;background:#111;display:flex;flex-direction:column;
padding:30px 6px 10px;transition:transform .3s}
.menu-side.hidden{transform:translateX(-100%)}
.menu-side button{background:none;border:none;color:#fff;margin:6px 0;
padding:10px 6px;font-size:.8em;cursor:pointer;border-radius:8px}
.menu-side button:hover{background:#222}
.content{flex:1;padding:20px}
.section{display:none}
ul{list-style:none;padding:0;margin:0}
li{padding:10px 0;border-bottom:1px solid #e5e5e5;
display:flex;justify-content:space-between}
.price{color:#555}
footer{text-align:center;font-size:.8em;color:#666;padding:20px}
footer .address{margin-bottom:6px}
</style>

<script>
function hideSections(){
  var s=document.querySelectorAll('.section');
  for(var i=0;i<s.length;i++){s[i].style.display='none'}
}
function showSection(id){
  hideSections();
  document.getElementById(id).style.display='block';
  document.getElementById('menuSide').classList.add('hidden');
}
function toggleMenu(){
  document.getElementById('menuSide').classList.toggle('hidden');
}
</script>
</head>

<body>
<header>
  <h1>Restaurante El Bizarro</h1>
  <div class="desc">
    Dirigido por Carlos Pinto, se distingue por la calidad de sus platos,
    la innovación gastronómica y una buena carta de vinos...
  </div>
  <div class="menu-toggle" onclick="toggleMenu()">Menu</div>
</header>

<div class="container">
  <nav class="menu-side hidden" id="menuSide">
    <button onclick="showSection('Carnes')">Carnes</button>
    <button onclick="showSection('Entrantes')">Entrantes</button>
    <button onclick="showSection('Postres')">Postres</button>
  </nav>

  <div class="content">
    <div class="section" id="Carnes" style="display:block">
      <ul>
        <li><span>Salsa para carne</span><span class="price"></span></li>
        <li><span>Solomillo</span><span class="price">24</span></li>
      </ul>
    </div>
  </div>
</div>

<footer>
  <div class="address">Dirección · Teléfono</div>
  <div>Carta actualizada el 2025</div>
</footer>
</body>
</html>
